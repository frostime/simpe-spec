commands:
  pack-zip:
    description: 将关键源代码打包成 zip
    type: script
    invoke: powershell -File {script}
    script_file: pack-zip.ps1
  test-project-init:
    description: 测试 project init  以及 project  update
    type: script
    invoke: pwsh -File {script}
    script_file: run_sspec_temp.ps1
  build-install:
    description: 编译并安装项目
    type: script
    invoke: pwsh -File {script}
    script_file: scripts\build_install.ps1
    script_strategy: ref
  venv:
    description: 激活虚拟环境
    type: cmd-line
    invoke: .venv/Scripts/activate
